<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15171c; --panel:rgba(20,22,28,.74); --line:rgba(255,255,255,.09);
  --text:#f2efe9; --mute:#9a9ca6; --accent:#ff5a36; --accent2:#ffb02e; --good:#4ade80;
  --display:'Archivo Black',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lbl{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 #000}
.big{font-family:var(--display);font-size:76px;line-height:.92;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 5px 0 #000,0 0 30px rgba(0,0,0,.35)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .tl,#hud .tr,#hud #combo,#hud #boss{pointer-events:none}
#hud #tools{pointer-events:auto}
.tl{position:absolute;left:24px;top:18px;max-width:46vw}
.tr{position:absolute;right:24px;top:18px;text-align:right}
.progrow{display:flex;align-items:center;gap:8px}
.progrow .prog{flex:none}
#roomTag{margin-top:10px;font-family:var(--display);font-size:11px;letter-spacing:.06em;color:#15171c;background:var(--accent2);border-radius:6px;padding:2px 6px;box-shadow:0 2px 0 #000}
#roomTag:empty{display:none}
#today{font-weight:800;font-size:13px;margin-top:6px;color:#e4e2dc;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap}
#today span{color:var(--accent2)}
#dept{font-family:var(--display);font-size:16px;margin-top:8px;color:var(--accent2);text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:10px;width:200px;border-radius:5px;background:#000;margin-top:10px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.5)}
#progBar{height:100%;width:0;background:var(--accent2);border-radius:5px;transition:width .25s}
.rage{color:var(--accent)}
#tools{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#tools button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#2a2d35;box-shadow:0 4px 0 #0b0c0f;transition:transform .08s,box-shadow .08s}
#tools button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0c0f}
#tools svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#combo{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-family:var(--display);font-size:26px;color:var(--accent2);text-shadow:0 2px 0 #000,0 0 22px rgba(255,90,54,.55);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#combo small{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.2em;display:block;text-align:center;color:var(--text)}
#boss{position:absolute;left:50%;top:76px;transform:translateX(-50%);width:min(440px,70vw);display:none;text-align:center;pointer-events:none}
#boss .bname{font-family:var(--display);font-size:13px;letter-spacing:.12em;color:#ffd166;text-shadow:0 2px 0 #000}
#boss .bbar{height:12px;margin-top:6px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,209,102,.5);overflow:hidden}
#bossBar{height:100%;width:100%;background:linear-gradient(90deg,#ff3b2f,#ffd166);transition:width .15s}
#shop{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;padding:10px 4px 8px}
#shop::-webkit-scrollbar{display:none}
.up{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:16px;text-align:left;background:#2a2d35;color:#8b8f99;box-shadow:0 6px 0 #0b0c0f;transition:transform .08s,box-shadow .08s,background .15s}
.up.ok:hover{transform:translateY(-2px);box-shadow:0 8px 0 #9c2c14}
.up.ok:active{transform:translateY(5px);box-shadow:0 1px 0 #9c2c14}
.up .ic{position:relative;width:34px;height:34px;display:grid;place-items:center;font-size:28px;line-height:1}
.up .lv{position:absolute;right:-8px;bottom:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent2);color:#000;font-family:var(--display);font-size:11px;line-height:20px;text-align:center;box-shadow:0 2px 0 #000}
.up .lv:empty{display:none}
.up .nm{font-family:var(--display);font-size:12px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.up .sn{display:none;font-family:var(--display);font-size:10px;text-transform:uppercase}
#tip{position:absolute;left:50%;bottom:104px;transform:translate(-50%,6px);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:#000;box-shadow:0 4px 0 rgba(0,0,0,.4);font-size:13px;font-weight:600;line-height:1.4;text-align:center;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#tip.show{opacity:1;transform:translate(-50%,0)}
#tip b{color:var(--accent2)}
.up .cost{font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums;margin-top:3px}
.up.ok{background:var(--accent);color:#fff;box-shadow:0 6px 0 #9c2c14;cursor:pointer}
.up.ok .cost{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.up.no{cursor:default}
#shop.many .up{flex-direction:column;gap:3px;padding:9px 6px 8px;width:84px;text-align:center}
#shop.many .up .nm{display:none}
#shop.many .up .sn{display:block}
#shop.many .up .cost{font-size:16px;margin-top:0}
.up.no:not(.max) .em{filter:grayscale(1);opacity:.55}
.up.max{background:#1e3a2a;color:var(--good);box-shadow:0 6px 0 #0b0c0f}
#elevBtn{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) scale(.9);padding:16px 26px;border-radius:14px;font-family:var(--display);font-size:18px;letter-spacing:.04em;color:#1a1208;background:linear-gradient(180deg,#ffd166,#ff9f1c);box-shadow:0 8px 0 #a35a00,0 18px 40px rgba(255,159,28,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#elevBtn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);animation:bob 1.2s ease-in-out infinite}
#elevBtn:active{box-shadow:0 3px 0 #a35a00;translate:0 5px}
#elevBtn small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.14em;opacity:.7;margin-top:2px}
@keyframes bob{50%{translate:0 -4px}}
#hint{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);font-weight:800;font-size:15px;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s;white-space:nowrap}
#toasts{position:absolute;left:20px;bottom:120px;display:flex;flex-direction:column;gap:10px;width:min(400px,calc(100vw - 40px));pointer-events:none}
.memo{background:#f7f3e8;color:#2a2620;border-radius:6px;padding:14px 18px 15px;font-size:15px;font-weight:500;line-height:1.42;box-shadow:0 10px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4);transform:rotate(-1deg);animation:memo 7.5s forwards}
.memo b{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;color:#b23a1f;margin-bottom:5px}
.memo i{display:block;font-style:normal;font-size:12px;color:#7a7266;margin-top:6px}
@keyframes memo{0%{opacity:0;translate:-20px 0}6%{opacity:1;translate:0 0}88%{opacity:1}100%{opacity:0;translate:0 8px}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.num{position:absolute;font-family:var(--display);font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);white-space:nowrap;animation:rise .8s ease-out forwards;translate:-50% -50%}
.num.crit{font-size:28px;color:var(--accent2)}
.num.splash{font-size:13px;color:#ffc9b8}
.num.intern{font-size:12px;color:#b9c2d0}
.num.relic{font-size:24px;color:#ffd166;letter-spacing:.04em;animation-duration:1.8s}
.num.loaded{font-size:12px;color:#ffd9a0;letter-spacing:.08em;animation-duration:1.1s}
.num.yelp{font-family:var(--body);font-weight:800;font-size:13px;color:#fff;background:#000;padding:2px 7px;border-radius:8px;animation-duration:1.4s}
.num.chair{font-size:20px;color:#9fd3ff}
.num.reward{font-size:22px;color:var(--accent);animation-duration:1.2s}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-60px) scale(1)}}
body.bossfloor #toasts{margin-top:44px}
#bragBtn{position:absolute;left:50%;bottom:196px;transform:translateX(-50%) scale(.9);padding:12px 20px;border-radius:14px;font-family:var(--display);font-size:15px;color:#111;background:#fff;box-shadow:0 6px 0 #8f949c;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#bragBtn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);animation:bob 1.2s ease-in-out infinite}
#bragBtn:active{box-shadow:0 2px 0 #8f949c;translate:0 4px}
.cta2{margin-top:16px;font-family:var(--display);font-size:15px;padding:12px 22px;border-radius:12px;background:#2a2d35;color:#ffd166;box-shadow:0 5px 0 #0b0c0f}
.cta2:active{transform:translateY(4px);box-shadow:0 1px 0 #0b0c0f}
.world{margin-top:18px;font-family:var(--display);font-size:13px;letter-spacing:.04em;color:var(--accent2);min-height:16px}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,11,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal[hidden]{display:none}
#modal .card{touch-action:pan-y;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#1d2027;border-radius:20px;padding:22px;box-shadow:0 10px 0 #0b0c0f}
#modal h2{font-family:var(--display);font-size:26px;line-height:1;margin-bottom:4px}
#modal h3{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--accent2);margin:20px 0 10px}
#modal p{font-size:14px;line-height:1.5;color:#c9cbd2}
#modal .x{float:right;width:34px;height:34px;border-radius:10px;background:#2a2d35;font-weight:800;box-shadow:0 3px 0 #0b0c0f}
.relics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.relic{background:#262a32;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.35;color:#9a9ca6}
.relic b{display:block;font-family:var(--display);font-size:12px;color:#fff;margin-bottom:3px}
.relic.found{background:#2f2a1c}
.relic.found b{color:#ffd166}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#262a32;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:20px}
.stat span{font-size:11px;color:#9a9ca6;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{flex:1 1 auto;padding:12px 14px;border-radius:12px;font-family:var(--display);font-size:13px;background:var(--accent);color:#fff;box-shadow:0 5px 0 #9c2c14;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9c2c14}
.btn.dark{background:#2a2d35;color:#fff;box-shadow:0 5px 0 #0b0c0f}
.btn.dark:active{box-shadow:0 1px 0 #0b0c0f}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14px;font-weight:600}
.row + .row{border-top:1px solid rgba(255,255,255,.06)}
.pill{padding:8px 12px;border-radius:10px;background:#2a2d35;font-family:var(--display);font-size:12px;box-shadow:0 3px 0 #0b0c0f;min-width:74px}
.danger{margin-top:18px;font-size:12px;color:#7d808a;text-decoration:underline}
.shareimg{width:100%;border-radius:12px;display:block;margin:12px 0 4px;background:#000;aspect-ratio:1200/630}
.big-time{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent2);margin:10px 0 4px}
body.rm .logo em,body.rm .face .t,body.rm #elevBtn.show,body.rm #bragBtn.show{animation:none}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:banner 2.6s ease forwards}
#banner .f{font-family:var(--display);font-size:clamp(44px,9vw,92px);line-height:.95;text-shadow:0 4px 0 #000,0 0 40px rgba(0,0,0,.5)}
#banner .d{font-weight:800;letter-spacing:.24em;font-size:13px;color:var(--accent2);margin-top:10px;text-shadow:0 2px 0 #000}
@keyframes banner{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#elev{position:fixed;inset:0;pointer-events:none;z-index:5}
#elev .door{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#8d939c 0 2px,#a7adb5 2px 9px,#959ba4 9px 13px),linear-gradient(#b8bec6,#7a8089);background-blend-mode:multiply;transition:transform .55s cubic-bezier(.7,0,.3,1);box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
#elev .l{left:0;transform:translateX(-101%);border-right:2px solid #555b63}
#elev .r{right:0;transform:translateX(101%);border-left:2px solid #555b63}
#elev.closed .l,#elev.closed .r{transform:none}
#elev.closed{pointer-events:auto}
.elevInd{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#0c0c0e;border:3px solid #333;border-radius:10px;padding:8px 22px;font-family:var(--display);font-size:42px;color:#ff6b3d;text-shadow:0 0 14px #ff3b1f;display:flex;gap:14px;align-items:center;opacity:0;transition:opacity .2s}
#elev.closed .elevInd{opacity:1;transition-delay:.35s}
.elevInd span{font-size:24px;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#title{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(21,23,28,.72),rgba(21,23,28,.94) 70%);transition:opacity .5s}
#title.gone{opacity:0;pointer-events:none}
.kicker{font-weight:800;letter-spacing:.3em;font-size:12px;color:var(--accent2);text-shadow:0 2px 0 #000}
.logo{font-family:var(--display);font-size:clamp(48px,11vw,128px);line-height:.88;margin:14px 0 10px;letter-spacing:-.01em;text-shadow:0 6px 0 #000}
.logo em{font-style:normal;color:var(--accent);display:inline-block;animation:tilt 2.4s ease-in-out infinite}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-6deg) translateY(-4px)}86%{transform:rotate(3deg)}}
.face{font-size:clamp(20px,4vw,34px);font-weight:800;color:var(--text);opacity:.9;white-space:nowrap}
.face .t{display:inline-block;animation:flip 2.4s cubic-bezier(.5,0,.3,1) infinite;transform-origin:50% 60%}
@keyframes flip{0%,30%{transform:rotate(0)}55%,100%{transform:rotate(180deg) translateY(-2px)}}
.tag{color:#f2efe9;margin:18px auto 28px;max-width:460px;font-size:17px;font-weight:600;line-height:1.5;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.9)}
.cta{font-family:var(--display);font-size:20px;padding:18px 34px;border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 7px 0 #a8321a,0 20px 50px rgba(255,90,54,.35);transition:transform .1s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(5px);box-shadow:0 2px 0 #a8321a}
.quit{display:block;margin:10px auto 0;font-size:11px;color:#6d707a;text-decoration:underline}
.quit:hover{color:var(--accent)}
.fine{margin-top:26px;font-size:13px;font-weight:600;color:#c9cbd2;letter-spacing:.02em;text-shadow:0 1px 0 #000,0 0 12px rgba(0,0,0,.9)}
@media (max-width:640px){
  .tl{left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
  .tr{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top))}
  .big{font-size:50px}
  .lbl{font-size:12px}
  #dept{font-size:13px;margin-top:6px}
  #today{font-size:11px;margin-top:4px}
  .prog{width:96px;height:8px;margin-top:8px}
  #roomTag{margin-top:8px;font-size:10px}
  #tools{margin-top:10px}
  #tools button{width:40px;height:40px}
  #shop{left:10px;right:10px;transform:none;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom));gap:6px}
  .up{flex:1 1 0;min-width:0;flex-direction:column;gap:4px;padding:10px 2px 9px;text-align:center;border-radius:14px}
  .up .ic{width:30px;height:30px;font-size:24px}
  .up .cost{font-size:16px;margin-top:2px}
  .up .nm{display:none}
  .up .sn{display:block}
  .up .cost{margin-top:0}
  .up .lv{top:-6px;bottom:auto;right:-10px}
  #shop.many{gap:4px}
  #shop.many .up{width:auto;flex:1 1 0;padding:8px 1px 7px}
  #shop.many .up .ic{font-size:20px;width:26px;height:26px}
  #shop.many .up .cost{font-size:13px}
  #shop.many .up .sn{font-size:9px}
  /* dock: a 46px row right above the upgrade bar. The camera never frames the floor under it. */
  #toasts,#tip,#hint,#elevBtn,#bragBtn{bottom:calc(98px + env(safe-area-inset-bottom))}
  #toasts{left:10px;right:10px;width:auto;top:auto;transform:none;gap:0;pointer-events:auto}
  #toasts .memo:not(:last-child){display:none}
  .memo{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;line-height:1.3;transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 rgba(0,0,0,.35);animation-duration:6s;cursor:pointer}
  .memo b{display:inline;flex:none;font-size:9px;margin:0;letter-spacing:.12em}
  .memo .tx{overflow:hidden;text-overflow:ellipsis}
  .memo i{display:none}

  const p = t.g.position.clone(); p.y += 0.6;

function kill(t, src, dir) {
  t.dead = true; t.hover = false; alive--; floorFlipped++; S.flipped++;

  const gain = mode === 'daily' ? 0 : t.reward * (t.loadMult ?? load) * (relic ? relic.mult : 1) * (src === 'click' ? comboMult() : 1) * (src === 'intern' ? 1 : sevMult()); // severance is yours, not the interns'

    spawnText(p.clone().setY(2.2), `${relic.name} ×${relic.mult}`, 'relic');

    const n = Object.keys(S.found).length;

    if (first) { track('relic', { key: t.relic, n }); bragMoment({ headline: relic.name, sub: `Office relic ${n} / ${RELIC_KEYS.length}`, lines: [`Found on floor ${S.floor}`, `${S.flipped.toLocaleString()} tables flipped`] }, `I found the ${relic.name} (${n}/${RELIC_KEYS.length} office relics) on floor ${S.floor}. (╯°□°)╯︵ ┻━┻`, 'relic'); }
  } else if (load >= 1.4) spawnText(p.clone().setY(0.6), `LOADED ×${load.toFixed(1)}`, 'loaded');
  t.topMat.emissive.setRGB(0, 0, 0);
  if (!dir) dir = new THREE.Vector3(-camDir.x, 0, -camDir.z);

  const axis = UP.clone().cross(dir).normalize();
  // land somewhere clear: shorten the throw until it doesn't pile onto another desk or leave the room
  let dist = t.boss ? 1.2 : rand(1.0, 1.7);
  const clear = q => Math.abs(q.x - room().cx) < W / 2 - 0.9 && Math.abs(q.z - room().cz) < D / 2 - 0.7 &&
    tables.every(o => o === t || Math.hypot((o.land || o.base).x - q.x, (o.land || o.base).z - q.z) > (o.radius + t.radius) * 0.75);

  if (t.kind === 'rack' || t.kind === 'gpu') { sparks(t.g.position, t.kind === 'gpu' ? 32 : 18); tone('sawtooth', 1800, 200, 0.4, 0.06); }

}

function nearestLive(pos, maxD, except) {

function updateTable(t, dt) {
  const g = t.g;
  if (t.flip) {
    const f = t.flip;
    if (f.t < f.dur) {
      f.t += dt;

  if (dow === 0 || dow === 6) [key, text] = ['weekend', `It's ${day}, ${t}. Nobody asked you to come in. You came in anyway. The tables respect that, and fear it.`];

    <h3>OFFICE RELICS · ${relicCount()} / ${RELIC_KEYS.length}</h3><div class="relics">${relics}</div>
    <h3>EASTER EGGS · ${eggCount()} / ${EGG_KEYS.length}</h3><div class="relics">${eggList}</div>
    <h3>STATS</h3><div class="stats">
      <div class="stat"><b>${S.flipped.toLocaleString()}</b><span>tables flipped</span></div>
      <div class="stat"><b>${Math.max(S.bestEver, S.best)}</b><span>highest floor</span></div>
      <div class="stat"><b>×${sevMult().toFixed(1)}</b><span>severance bonus</span></div>
      <div class="stat"><b>${worldTotal ? fmt(worldTotal) : '—'}</b><span>flipped worldwide</span></div>
      <div class="stat"><b>${workday().flips.toLocaleString()}</b><span>flipped today</span></div>
      <div class="stat"><b>${workday().work.toLocaleString()}</b><span>on company time (Mon–Fri 9–17)</span></div>
    </div>
    <p style="font-size:12px;margin-top:8px;color:#9a9ca6">Your workday follows your timezone: ${TZ.replace(/_/g, ' ')}, ${clock(new Date())}.</p>
    <h3>QUIT &amp; REHIRE</h3>
    <p>${gain ? `HR has prepared a severance package: <b>+${gain}</b> severance (each one is +10% rage and damage, forever). You restart on floor 1 with no rage or upgrades, but keep your relics and flip count.` : `Reach floor 25 to negotiate a severance package. Each one makes you permanently stronger. You have ${S.sev}.`}</p>
    <div class="btns"><button class="btn" data-a="rehire" ${gain && mode === 'career' ? '' : 'disabled'}>${gain ? `Quit &amp; Rehire (+${gain})` : 'Not yet'}</button>
    <button class="btn dark" data-a="daily">☀ Floor of the Day #${dayNumber()}</button></div>
    <h3>SETTINGS</h3>
    <div class="row">Sound <button class="pill" data-a="sound">${S.muted ? 'OFF' : 'ON'}</button></div>
    <div class="row">Motion (screen shake, slow-mo) <button class="pill" data-a="motion">${motionLabel}</button></div>
    <div class="row" style="font-weight:500;color:#9a9ca6;font-size:12px">Keyboard: ←/→ pick a desk · Space hit · E elevator · 1–7 buy · M mute · Esc close</div>
    <button class="danger" data-a="erase">Erase all progress</button>`);
  modalCard.addEventListener('click', e => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    if (a === 'sound') { audio(); setMute(!S.muted); e.target.textContent = S.muted ? 'OFF' : 'ON'; }
    if (a === 'motion') { S.motion = S.motion == null ? 'reduce' : S.motion === 'reduce' ? 'full' : null; applyMotion(); save(); e.target.textContent = S.motion === 'reduce' ? 'REDUCED' : S.motion === 'full' ? 'FULL' : 'AUTO'; }
    if (a === 'rehire') rehire();
    if (a === 'daily') { closeModal(); startDaily(); }
    if (a === 'erase' && confirm('Erase everything? Rage, upgrades, floors, relics, severance. The tables will be put back. This is the real tragedy.')) { try { localStorage.removeItem(SAVE_KEY); } catch (err) {} location.reload(); }
  });
}
function applyMotion() { document.body.classList.toggle('rm', reducedMotion()); }
$('#menuBtn').addEventListener('click', () => { audio(); openMenu(); });

// ---------------------------------------------------------------- prestige
function rehire() {
  const gain = sevGain(); if (!gain || mode !== 'career') return;
  S.sev += gain; S.hires++; S.bestEver = Math.max(S.bestEver, S.best, S.floor);
  S.floor = 1; S.best = 1; S.rage = 0; S.up = Object.fromEntries(Object.keys(DEF.up).map(k => [k, 0]));
  save(); closeModal(); track('rehire', { gain, total: S.sev });
  $('#elevBtn').classList.remove('show');
  buildFloor(S.floor); renderShop(); banner(S.floor);
  memo(`Welcome back! HR has no record of you. Your severance (×${sevMult().toFixed(1)}) has been quietly applied.`, 'ONBOARDING');
  bragMoment({ headline: 'QUIT & REHIRED', sub: `Severance ×${sevMult().toFixed(1)}`, lines: [`Made it to floor ${S.bestEver}`, `${S.flipped.toLocaleString()} tables flipped`] }, `I quit my job at floor ${S.bestEver}, got rehired, and came back stronger (×${sevMult().toFixed(1)}). (╯°□°)╯︵ ┻━┻`, 'rehire');
}

// ---------------------------------------------------------------- Floor of the Day: same floor for everyone, fixed rules, beat the clock
const DAY0 = Date.UTC(2026, 9, 1);
const dayNumber = () => Math.floor((Date.now() - DAY0) / 864e5) + 1;
const DAILY_THEMES = ['office', 'openplan', 'breakroom', 'server'];
let dailyStart = 0, dailyTime = 0, dailyDay = 0;
function startDaily() {
  audio();
  if (!started) beginShift(true);
  mode = 'daily'; dailyDay = dayNumber(); dailyStart = 0; dailyTime = 0;
  $('#elevBtn').classList.remove('show'); $('#bragBtn').classList.remove('show');
  $('#shop').style.display = 'none';
  $('#flLbl').textContent = 'TIME'; $('#rgLbl').textContent = 'BEST TODAY';
  buildFloor(12 + dailyDay % 7, dailyDay);
  bannerText('FLOOR OF THE DAY', `#${dailyDay} · FLIP EVERYTHING · CLOCK STARTS ON YOUR FIRST HIT`);
  track('daily_start', { day: dailyDay });
}
function endDaily() {
  mode = 'career';
  $('#shop').style.display = '';
  $('#flLbl').textContent = 'FLOOR'; $('#rgLbl').textContent = 'RAGE';
  buildFloor(S.floor); renderShop(); banner(S.floor);
}
function dailyDone() {
  const best = S.daily[dailyDay], pb = !best || dailyTime < best;
  if (pb) S.daily[dailyDay] = dailyTime;
  save(); track('daily_done', { day: dailyDay, time: +dailyTime.toFixed(2) });
  const desks = tables.length, text = `Flipping Tables · Floor of the Day #${dailyDay}\n${desks} ${tables[0]?.kind === 'rack' ? 'servers' : 'tables'} in ${dailyTime.toFixed(2)}s (╯°□°)╯︵ ┻━┻`;
  setTimeout(() => {
    openModal(`<h2>Floor of the Day #${dailyDay}</h2><div class="big-time">${dailyTime.toFixed(2)}s</div>
      <p>${pb ? (best ? 'New personal best!' : 'First run today. The bar has been set.') : `Your best today: ${best.toFixed(2)}s`} Everyone gets the same floor. Tomorrow there's a new one.</p>
      <div class="btns"><button class="btn" data-a="share">📸 Share result</button><button class="btn dark" data-a="again">Try again</button><button class="btn dark" data-a="back">Back to work</button></div>`, null);
    modalCard.addEventListener('click', e => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (a === 'share') shareFlow({ headline: `${dailyTime.toFixed(2)}s`, sub: `Floor of the Day #${dailyDay}`, lines: [`${desks} desks flipped`, pb ? 'Personal best' : `Best today: ${S.daily[dailyDay].toFixed(2)}s`] }, text, 'daily');
      if (a === 'again') { closeModal(); startDaily(); }
      if (a === 'back') { closeModal(); endDaily(); }
    });
  }, 900);
}

// ---------------------------------------------------------------- office ambience: keyboards and phones that go quiet as the floor empties
let ambT = 1, phoneT = 20;
function ambience(dt) {
  if (!AC || S.muted || !tables.length) return;
  const busy = alive / tables.length;
  if ((ambT -= dt) <= 0) {
    ambT = rand(0.06, 0.32) / Math.max(0.15, busy);
    if (busy > 0) noise(0.018, 0.035 * busy, 'highpass', 2500 + Math.random() * 2500);
  }
  if ((phoneT -= dt) <= 0) {
    phoneT = rand(18, 40);
    if (busy > 0.4) for (let i = 0; i < 6; i++) tone('sine', i % 2 ? 1250 : 1500, i % 2 ? 1250 : 1500, 0.07, 0.025 * busy, i * 0.08);
  }
}

// ---------------------------------------------------------------- keyboard
let kbSel = null;
function kbSelect(stepDir) {
  const live = tables.filter(t => !t.dead && t.room === activeRoom);
  if (!live.length) return;
  const v = new THREE.Vector3(), xs = live.map(t => ({ t, x: v.copy(t.g.position).project(camera).x + v.y * 0.01 })).sort((a, b) => a.x - b.x);
  let i = xs.findIndex(o => o.t === kbSel);
  i = i < 0 ? 0 : (i + stepDir + xs.length) % xs.length;
  if (kbSel) { kbSel.hover = false; tint(kbSel); }
  kbSel = xs[i].t; kbSel.hover = true; tint(kbSel);
}
addEventListener('keydown', e => {
  if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (!started || e.target.closest?.('input,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'arrowleft') { kbSelect(k === 'arrowright' ? 1 : -1); e.preventDefault(); }
  else if (k === ' ' || k === 'enter') {
    e.preventDefault();
    if (e.repeat) return; // holding the key down is not a turbo button: one press, one hit
    if (cleared && mode === 'career') return rideElevator();
    if (!kbSel || kbSel.dead) { if (hovered && !hovered.dead) kbSel = hovered; else kbSelect(1); }
    if (kbSel && !kbSel.dead) playerHit(kbSel);
  }
  else if (k === 'e' && cleared && mode === 'career') rideElevator();
  else if (k === 'm') { audio(); setMute(!S.muted); }
  else if (/^[1-9]$/.test(k)) { const u = UPG.filter(unlocked)[+k - 1]; if (u && mode === 'career') buy(u); }
});

// ---------------------------------------------------------------- loop
let last = performance.now(), time = 0, uiAcc = 0, saveAcc = 0, flushAcc = 0;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  fitCamera();
}
addEventListener('resize', resize);

function loop(now) {
  const realDt = Math.min(0.05, (now - last) / 1000); last = now;
  if (slowT > 0) slowT -= realDt;
  const dt = realDt * (slowT > 0 ? 0.25 : 1); time += dt;
  if (started) {
    S.rage += emailRate() * dt; S.lifetime += emailRate() * dt;
    for (const it of interns) updateIntern(it, dt);
    for (const cw of coworkers) updateCoworker(cw, dt);
    updateHR(dt); updatePrinter(dt); updateEggs(dt); updateDog(dt);
    uiAcc += dt; if (uiAcc > 0.2) { uiAcc = 0; refreshShop(); }
    saveAcc += realDt; if (saveAcc > 5) { saveAcc = 0; save(); }
    flushAcc += realDt; if (flushAcc > 20) { flushAcc = 0; flushFlips(); }
    ambience(realDt);
    if (mode === 'career') idleCheck(realDt);
  }
  for (const t of tables) updateTable(t, dt);
  if (elev.d1 && Math.abs(elev.target - elev.open) > 0.001) {
    elev.open += (elev.target - elev.open) * Math.min(1, dt * 5);
    elev.d1.position.z = elev.z - 0.42 - elev.open * 0.8; elev.d2.position.z = elev.z + 0.42 + elev.open * 0.8;
  }
  rackFaceMat.map = rackFaces[(time * 2.5 | 0) % 2];
  gpuFaceMat.map = gpuFaces[(time * 3 | 0) % 3];
  updateHolos(dt);
  const pulse = 0.12 + 0.18 * (0.5 + 0.5 * Math.sin(time * 4));
  for (const m of RELIC_MATS) m.emissiveIntensity = pulse;
  updateDebris(dt); updatePuffs(dt);

  // camera: gentle orbit sway + mouse parallax + shake
  camShake = Math.max(0, camShake - realDt * 2.2);
  camTarget.lerp(camGoal, 1 - Math.exp(-realDt * 3)); // walk the camera to the active room
  sun.position.set(camTarget.x + W * 0.35, 16, camTarget.z + D * 0.55 + 4); sun.target.position.copy(camTarget);
  for (const c of conns) {
    if (c.unlocked && c.door && c.door.open < 1) { const d = c.door; d.open = Math.min(1, d.open + realDt * 1.5); d.mesh.position[d.axis === 'x' ? 'x' : 'z'] = d.base - 1.9 * d.open; }
    if (c.unlocked) c.arrowMat.opacity = 0.55 + 0.45 * Math.sin(time * 6) ** 2;
  }
  const sway = reducedMotion() ? 0 : started ? 0.04 : 0.25;
  const dir = camDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(time * 0.15) * sway - mouse.x * 0.06);
  camera.position.copy(camTarget).addScaledVector(dir, camDist);
  camera.position.y += mouse.y * 0.8;
  if (camShake > 0) { const s = camShake * camShake * 0.6; camera.position.x += rand(-s, s); camera.position.y += rand(-s, s); camera.position.z += rand(-s, s); }
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
  if (started) updateHud();
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------- boot
setMute(S.muted);
$('#hint').textContent = coarse ? "Tap a desk. You've earned this." : "Click a desk. You've earned this.";
buildFloor(S.floor);
resize();
renderShop();
if (S.flipped > 0) {
  $('#startBtn').textContent = `RETURN TO FLOOR ${S.floor}`;
  $('#fine').textContent = `${S.flipped.toLocaleString()} tables flipped so far. They have not been put back.`;
  $('#hint').style.opacity = 0;
}
$('#dailyBtn').textContent = `☀ FLOOR OF THE DAY #${dayNumber()}${S.daily[dayNumber()] ? ` · BEST ${S.daily[dayNumber()].toFixed(2)}s` : ''}`;
$('#hud').style.visibility = 'hidden';
applyMotion(); fetchWorld();
$('#dailyBtn').addEventListener('click', () => startDaily());
$('#startBtn').addEventListener('click', () => beginShift(false));
function beginShift(daily) {
  audio(); started = true;
  $('#title').classList.add('gone');
  $('#hud').style.visibility = 'visible';
  track('start', { floor: S.floor, daily });
  noteInput(); hoursT = 900; setTimeout(hoursMemo, 4000);
  if (daily) return;
  banner(S.floor);
  if (S.t && S.up.email) {
    const secs = Math.min(7200, (Date.now() - S.t) / 1000), gain = emailRate() * secs * 0.5;
    if (gain >= 1) { S.rage += gain; S.lifetime += gain; memo(`While you were away, your Reply-All storm generated ${fmt(gain)} rage.`, 'WELCOME BACK'); }
  }
  save();
}
addEventListener('visibilitychange', () => { if (document.hidden && started) { save(); flushFlips(true); } });
requestAnimationFrame(loop);
</script>
